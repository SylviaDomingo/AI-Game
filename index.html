
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>水墨县令 - 儿童教育游戏</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto+Serif+SC', serif;
            background-color: #f4ece1;
            overflow: hidden;
        }
        .font-calligraphy {
            font-family: 'Ma Shan Zheng', cursive;
        }
        /* Custom scrollbar for ink style */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #e6dfd1;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a4a4a;
            border-radius: 2px;
        }
        .ink-border {
            border: 4px solid transparent;
            border-image: url('https://www.transparenttextures.com/patterns/brush-strokes.png') 30 stretch;
        }
        @keyframes drift {
            from { transform: translateX(-10px) translateY(0); opacity: 0.3; }
            to { transform: translateX(10px) translateY(-10px); opacity: 0.5; }
        }
        .cloud-anim {
            animation: drift 10s infinite alternate ease-in-out;
        }

        /* Portrait Animations */
        @keyframes portrait-idle {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(1deg); }
        }
        @keyframes blink-squash {
            0%, 92%, 100% { transform: scaleY(1); }
            96% { transform: scaleY(0.4); }
        }
        .animate-portrait-idle {
            animation: portrait-idle 4s ease-in-out infinite;
            transform-origin: bottom;
        }
        .animate-blink {
            animation: blink-squash 6s ease-in-out infinite;
            transform-origin: center;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body class="bg-[#f4ece1]">
    <div id="root"></div>
</body>
</html>
